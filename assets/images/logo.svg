<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="dzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow / Ambient -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="#10b981" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Base Squircle -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="url(#dzGrad)"/>
  <rect x="10" y="10" width="100" height="100" rx="26" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Text Dz -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-1.5">
    Dz
  </text>
  
  <!-- Subtle Algerian Accent Dot (Crescent/Star inspired micro dot) -->
  <circle cx="86" cy="34" r="5" fill="#f87171"/>
</svg>
